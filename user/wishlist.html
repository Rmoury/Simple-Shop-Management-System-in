<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Wishlist — SuperMall</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<nav class="user-nav">
  <div class="user-nav-logo">Super<span>Mall</span></div>
  <div class="user-nav-links">
    <a href="browse.html"   class="nav-pill">🏬 Browse</a>
    <a href="shops.html"    class="nav-pill">🏪 Shops</a>
    <a href="compare.html"  class="nav-pill">⚖️ Compare</a>
    <a href="wishlist.html" class="nav-pill active">❤️ Wishlist</a>
    <a href="floormap.html" class="nav-pill">🗺️ Floor Map</a>
    <span class="topbar-user" id="nav-user" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.15);font-size:.78rem"></span>
    <button class="btn btn-ghost btn-sm" id="nav-logout" style="color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.2)">Logout</button>
  </div>
</nav>

<div class="hero-section" style="padding:2rem">
  <h1>❤️ My <span>Wishlist</span></h1>
  <p>Products you've saved to buy later.</p>
</div>

<div class="browse-body">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
    <div class="sec-title" id="count-label" style="margin:0">Your Wishlist</div>
    <button class="btn btn-ghost btn-sm" onclick="clearAll()">Clear All</button>
  </div>
  <div id="wishlist-wrap"></div>
</div>

<div id="toast-container"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/logger.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/data-services.js"></script>
<script>
if(!Auth.requireAuth()) throw 0;
Auth.initNav();

function render(){
  const items = WishlistService.getAll();
  document.getElementById("count-label").textContent = `Your Wishlist (${items.length} items)`;
  if(!items.length){
    document.getElementById("wishlist-wrap").innerHTML=`<div class="empty-state"><span>❤️</span><p>Your wishlist is empty.</p><a href="browse.html" class="btn btn-primary" style="margin-top:.5rem">Browse Products</a></div>`;
    return;
  }
  document.getElementById("wishlist-wrap").innerHTML=`<div class="card-grid">
    ${items.map(p=>`
      <div class="product-card">
        <div class="product-card-img">
          ${p.image
            ?`<img src="${p.image}" alt="${p.name}" class="prod-img" loading="lazy"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
               <div class="img-placeholder" style="display:none">🛍️</div>`
            :`<div class="img-placeholder">🛍️</div>`}
        </div>
        <div class="product-card-body">
          <div class="product-card-name">${p.name}</div>
          <div class="product-card-shop">🏪 ${p.shopName||"—"}</div>
          <div class="product-card-price">
            <span class="price-now">${UI.currency(p.price)}</span>
          </div>
          <div class="card-actions">
            <button class="btn-cart" onclick="moveToCart('${p.id}')">🛒 Add to Cart</button>
            <button class="btn-wish active" onclick="removeItem('${p.id}')">❤️</button>
          </div>
        </div>
      </div>`).join("")}
  </div>`;
}

function moveToCart(id){
  const item = WishlistService.getAll().find(i=>i.id===id);
  if(!item) return;
  CartService.add(item);
  WishlistService.remove(id);
  UI.toast(`🛒 ${item.name} moved to cart!`,"success");
  render();
}

function removeItem(id){
  WishlistService.remove(id);
  UI.toast("Removed from wishlist","info");
  render();
}

function clearAll(){
  if(!WishlistService.getAll().length) return;
  UI.confirm("Clear your entire wishlist?",()=>{
    WishlistService.getAll().forEach(i=>WishlistService.remove(i.id));
    UI.toast("Wishlist cleared","info");
    render();
  });
}

render();
</script>
</body>
</html>
