<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Floor Map — SuperMall</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    .map-legend{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
    .legend-item{display:flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--text-mid)}
    .legend-dot{width:12px;height:12px;border-radius:3px}
    .floor-info-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-top:1.25rem}
    .shop-list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.75rem;margin-top:.75rem}
    .shop-list-item{display:flex;align-items:center;gap:.75rem;padding:.75rem;background:var(--bg);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
    .shop-list-item:hover{border-color:var(--orange);background:var(--orange-lt)}
    .shop-list-img{width:42px;height:42px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    .shop-list-img img{width:100%;height:100%;object-fit:cover}
  </style>
</head>
<body>
<nav class="user-nav">
  <div class="user-nav-logo">Super<span>Mall</span></div>
  <div class="user-nav-links">
    <a href="browse.html"   class="nav-pill">🏬 Browse</a>
    <a href="shops.html"    class="nav-pill">🏪 Shops</a>
    <a href="compare.html"  class="nav-pill">⚖️ Compare</a>
    <a href="wishlist.html" class="nav-pill">❤️ Wishlist</a>
    <a href="floormap.html" class="nav-pill active">🗺️ Floor Map</a>
    <span class="topbar-user" id="nav-user" style="background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.15);font-size:.78rem"></span>
    <button class="btn btn-ghost btn-sm" id="nav-logout" style="color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.2)">Logout</button>
  </div>
</nav>

<div class="hero-section" style="padding:2rem">
  <h1>🗺️ Mall <span>Floor Map</span></h1>
  <p>Find shops by floor, unit number, and category.</p>
</div>

<div class="browse-body">

  <!-- Search bar -->
  <div style="margin-bottom:1.25rem">
    <input type="text" id="map-search" class="form-control" style="max-width:400px"
           placeholder="🔍 Search shop name or unit…" oninput="searchShop()"/>
  </div>

  <!-- Floor tabs + map -->
  <div class="card" style="margin-bottom:1.25rem">
    <div class="card-header">
      <span class="card-title">🏢 Select Floor</span>
      <div class="map-legend" id="cat-legend"></div>
    </div>
    <div class="card-body">
      <div class="floor-tabs" id="floor-tabs"></div>
      <div class="floor-grid" id="floor-grid"></div>
    </div>
  </div>

  <!-- Floor info panel -->
  <div class="floor-info-panel" id="floor-info" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">
      <div style="font-family:var(--font-h);font-size:1rem;font-weight:700" id="fi-title">Floor Shops</div>
      <span class="badge badge-blue" id="fi-count"></span>
    </div>
    <div class="shop-list-grid" id="fi-shops"></div>
  </div>

</div>

<!-- Shop detail quick view -->
<div id="shop-modal" style="display:none">
  <div class="modal-overlay modal-show">
    <div class="modal-box" style="max-width:520px">
      <div class="modal-header"><h3 class="modal-title" id="sm-title">Shop</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div class="modal-body" id="sm-body"></div>
      <div class="modal-footer"><a id="sm-link" href="#" class="btn btn-primary">View All Products →</a><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/logger.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/data-services.js"></script>
<script>
if(!Auth.requireAuth()) throw 0;
Auth.initNav();

let allShops=[], allCats=[], floors=[], activeFloor="", catColorMap={};
const PALETTE=["#f97316","#0ea5e9","#22c55e","#8b5cf6","#ef4444","#eab308","#ec4899","#14b8a6"];

async function load(){
  [allShops, allCats] = await Promise.all([ShopService.getAll(), CategoryService.getAll()]);
  floors = [...new Set(allShops.map(s=>s.floor))].sort();

  // Assign colors to categories
  allCats.forEach((c,i)=>{ catColorMap[c.name]=PALETTE[i%PALETTE.length]; });

  // Legend
  document.getElementById("cat-legend").innerHTML = allCats.map(c=>`
    <div class="legend-item">
      <div class="legend-dot" style="background:${catColorMap[c.name]||'#94a3b8'}"></div>
      ${c.icon||""} ${c.name}
    </div>`).join("");

  // Floor tabs
  document.getElementById("floor-tabs").innerHTML = floors.map((f,i)=>`
    <button class="floor-tab ${i===0?'active':''}" onclick="selectFloor(this,'${f}')">${f}</button>`).join("");

  if(floors.length) selectFloor(document.querySelector(".floor-tab"), floors[0]);
}

function selectFloor(el, floor){
  document.querySelectorAll(".floor-tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  activeFloor = floor;
  renderGrid(allShops.filter(s=>s.floor===floor));
}

function renderGrid(shops){
  const grid = document.getElementById("floor-grid");
  if(!shops.length){ grid.innerHTML=`<p style="color:var(--text-light);font-size:.83rem;padding:.5rem 0">No shops on this floor yet.</p>`; renderInfoPanel([]); return; }

  // Build unit map (sort by unit number)
  const sorted = [...shops].sort((a,b)=>(a.unit||"").localeCompare(b.unit||""));
  grid.innerHTML = sorted.map(s=>`
    <div class="floor-unit ${!s.active?'empty':''}" onclick="${s.active?`openShop('${s.id}')`:''}"
         style="border-color:${s.active?catColorMap[s.category]||'var(--border)':'var(--border)'}">
      <div class="floor-unit-num">${s.unit||"—"}</div>
      <div class="floor-unit-name">${s.name}</div>
      <div class="floor-unit-cat">${allCats.find(c=>c.name===s.category)?.icon||""} ${s.category||""}</div>
      ${!s.active?`<div style="font-size:.62rem;color:var(--text-light);margin-top:.2rem">Closed</div>`:""}
    </div>`).join("");

  renderInfoPanel(shops.filter(s=>s.active));
}

function renderInfoPanel(shops){
  const panel = document.getElementById("floor-info");
  if(!shops.length){ panel.style.display="none"; return; }
  panel.style.display="block";
  document.getElementById("fi-title").textContent = `${activeFloor} — Active Shops`;
  document.getElementById("fi-count").textContent = `${shops.length} shops`;
  document.getElementById("fi-shops").innerHTML = shops.map(s=>`
    <div class="shop-list-item" onclick="openShop('${s.id}')">
      <div class="shop-list-img">
        ${s.image
          ?`<img src="${s.image}" alt="${s.name}" onerror="this.parentElement.innerHTML='🏪'"/>`
          :`🏪`}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:.85rem">${s.name}</div>
        <div style="font-size:.73rem;color:var(--text-light)">${s.unit} · ${allCats.find(c=>c.name===s.category)?.icon||""} ${s.category}</div>
        <div style="font-size:.72rem;color:var(--text-light)">🕐 ${s.open||"10:00"}–${s.close||"22:00"}</div>
      </div>
      <div style="font-size:.75rem;color:var(--text-light);text-align:right">
        <div>${UI.stars(s.rating||4.0)}</div>
        <div style="margin-top:.2rem">${s.reviewCount||0} reviews</div>
      </div>
    </div>`).join("");
}

async function openShop(id){
  const shop = allShops.find(s=>s.id===id); if(!shop) return;
  const [prods, offers] = await Promise.all([ProductService.getByShop(id), OfferService.getByShop(id)]);
  document.getElementById("sm-title").textContent = shop.name;
  document.getElementById("sm-link").href = `shops.html?id=${id}`;
  document.getElementById("sm-body").innerHTML=`
    <div style="display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap">
      <div style="width:100px;height:75px;border-radius:8px;overflow:hidden;background:var(--bg);flex-shrink:0">
        ${shop.image?`<img src="${shop.image}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='🏪'"/>`:"<div style='display:flex;align-items:center;justify-content:center;height:100%;font-size:2rem'>🏪</div>"}
      </div>
      <div>
        <p style="font-size:.83rem;color:var(--text-mid);margin-bottom:.4rem">${shop.description||""}</p>
        <div style="display:flex;gap:.4rem;flex-wrap:wrap">
          <span class="shop-tag">🏢 ${shop.floor} · ${shop.unit}</span>
          <span class="shop-tag">📞 ${shop.phone||"N/A"}</span>
          <span class="shop-tag">🕐 ${shop.open||"10:00"}–${shop.close||"22:00"}</span>
        </div>
        <div style="margin-top:.4rem">${UI.stars(shop.rating||4.0)} ${UI.statusBadge(shop.active)}</div>
      </div>
    </div>
    ${offers.filter(o=>o.active).length?`
      <div style="background:var(--orange-lt);border-left:4px solid var(--orange);border-radius:6px;padding:.75rem;margin-bottom:.75rem;font-size:.83rem">
        🏷️ <strong>${offers.filter(o=>o.active).length} active offer(s):</strong>
        ${offers.filter(o=>o.active).map(o=>`<strong>${o.discount} OFF</strong> — ${o.title} <code>${o.code||""}</code>`).join(" &nbsp;|&nbsp; ")}
      </div>`:""}
    <div style="font-size:.83rem"><strong>Products:</strong> ${prods.length} listed</div>`;
  document.getElementById("shop-modal").style.display="block";
}

function closeModal(){ document.getElementById("shop-modal").style.display="none"; }

function searchShop(){
  const q = document.getElementById("map-search").value.toLowerCase();
  if(!q){ if(activeFloor) renderGrid(allShops.filter(s=>s.floor===activeFloor)); return; }
  const results = allShops.filter(s=>s.name.toLowerCase().includes(q)||(s.unit||"").toLowerCase().includes(q));
  // Highlight matching floor if only one
  if(results.length){
    const fl = results[0].floor;
    document.querySelectorAll(".floor-tab").forEach(t=>{ t.classList.toggle("active", t.textContent===fl); });
    activeFloor = fl;
  }
  renderGrid(results);
}

load();
</script>
</body>
</html>
