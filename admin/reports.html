<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analytics — SuperMall Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">Super<span>Mall</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html"  class="nav-link"><span class="nav-icon">📊</span> Dashboard</a>
      <a href="shops.html"      class="nav-link"><span class="nav-icon">🏪</span> Shops</a>
      <a href="products.html"   class="nav-link"><span class="nav-icon">📦</span> Products</a>
      <a href="offers.html"     class="nav-link"><span class="nav-icon">🏷️</span> Offers</a>
      <a href="categories.html" class="nav-link"><span class="nav-icon">🗂️</span> Categories & Floors</a>
      <a href="reports.html"    class="nav-link active"><span class="nav-icon">📈</span> Analytics</a>
    </nav>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <span class="topbar-title">Analytics & Reports</span>
      <div class="topbar-right">
        <span class="topbar-user" id="nav-user"></span>
        <button class="btn btn-ghost btn-sm" id="nav-logout">Logout</button>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <div><h1>📈 Analytics</h1><p>Mall-wide statistics and insights.</p></div>
      </div>

      <div class="stats-row" id="stats"></div>

      <div class="two-col" style="margin-bottom:1.1rem">
        <div class="card">
          <div class="card-header"><span class="card-title">Products by Category</span></div>
          <div class="card-body" id="cat-chart"></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Shops by Floor</span></div>
          <div class="card-body" id="floor-chart"></div>
        </div>
      </div>

      <div class="two-col">
        <div class="card">
          <div class="card-header"><span class="card-title">Top Products by Price</span></div>
          <div class="card-body" id="top-price"></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Low Stock Alert</span></div>
          <div class="card-body" id="low-stock"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-container"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../js/logger.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/data-services.js"></script>
<script>
if(!Auth.requireAuth("admin")) throw 0;
Auth.initNav();

function bar(label, val, max, color="#f97316"){
  const pct = Math.round((val/max)*100);
  return `<div style="margin-bottom:.65rem">
    <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:.25rem"><span>${label}</span><strong>${val}</strong></div>
    <div style="background:var(--bg);border-radius:20px;height:10px;overflow:hidden">
      <div style="width:${pct}%;height:100%;background:${color};border-radius:20px;transition:width .6s"></div>
    </div></div>`;
}

async function load(){
  const [shops,prods,offers,cats] = await Promise.all([ShopService.getAll(),ProductService.getAll(),OfferService.getAll(),CategoryService.getAll()]);
  const totalVal = prods.reduce((s,p)=>s+(p.price||0)*Math.max(1,p.stock||0),0);

  document.getElementById("stats").innerHTML=`
    <div class="stat-card"><div class="stat-icon si-orange">🏪</div><div><div class="stat-val">${shops.length}</div><div class="stat-lbl">Total Shops</div></div></div>
    <div class="stat-card"><div class="stat-icon si-blue">📦</div><div><div class="stat-val">${prods.length}</div><div class="stat-lbl">Total Products</div></div></div>
    <div class="stat-card"><div class="stat-icon si-green">✅</div><div><div class="stat-val">${shops.filter(s=>s.active).length}</div><div class="stat-lbl">Active Shops</div></div></div>
    <div class="stat-card"><div class="stat-icon si-purple">🏷️</div><div><div class="stat-val">${offers.filter(o=>o.active).length}</div><div class="stat-lbl">Live Offers</div></div></div>
    <div class="stat-card"><div class="stat-icon si-red">⭐</div><div><div class="stat-val">${prods.filter(p=>p.featured).length}</div><div class="stat-lbl">Featured</div></div></div>`;

  // Products by category
  const byCat={};
  prods.forEach(p=>{ byCat[p.category||"Uncategorised"]=(byCat[p.category||"Uncategorised"]||0)+1; });
  const maxC = Math.max(...Object.values(byCat));
  const colors=["#f97316","#0ea5e9","#22c55e","#8b5cf6","#ef4444","#eab308"];
  document.getElementById("cat-chart").innerHTML = Object.entries(byCat).map(([k,v],i)=>bar(k,v,maxC,colors[i%colors.length])).join("");

  // Shops by floor
  const byFloor={};
  shops.forEach(s=>{ byFloor[s.floor||"Unknown"]=(byFloor[s.floor||"Unknown"]||0)+1; });
  const maxF = Math.max(...Object.values(byFloor));
  document.getElementById("floor-chart").innerHTML = Object.entries(byFloor).map(([k,v],i)=>bar(k,v,maxF,colors[i%colors.length])).join("");

  // Top by price
  document.getElementById("top-price").innerHTML = [...prods].sort((a,b)=>(b.discountPrice||b.price)-(a.discountPrice||a.price)).slice(0,6).map(p=>`
    <div style="display:flex;align-items:center;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--border)">
      <div style="width:38px;height:34px;border-radius:6px;overflow:hidden;background:var(--bg);flex-shrink:0">
        ${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='📦'"/>` :"<span style='font-size:1.2rem'>📦</span>"}
      </div>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.83rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${p.name}</div><div style="font-size:.72rem;color:var(--text-light)">${p.shopName}</div></div>
      <span style="font-family:var(--font-h);color:var(--orange);font-weight:700;font-size:.88rem">${UI.currency(p.discountPrice||p.price)}</span>
    </div>`).join("");

  // Low stock
  const low = prods.filter(p=>p.stock!=null&&p.stock<10).sort((a,b)=>a.stock-b.stock);
  document.getElementById("low-stock").innerHTML = low.length
    ? low.slice(0,6).map(p=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid var(--border)">
          <span style="font-size:.83rem;font-weight:600">${p.name}</span>
          <span class="badge ${p.stock===0?'badge-danger':'badge-orange'}">${p.stock===0?"Out of Stock":p.stock+" left"}</span>
        </div>`).join("")
    : "<div class='empty-state' style='padding:2rem'><span>✅</span><p>All products well stocked!</p></div>";
}
load();
</script>
</body>
</html>
